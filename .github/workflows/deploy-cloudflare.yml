name: Deploy to Cloudflare Pages
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript and unit tests
        run: pnpm check && pnpm test

      - name: Build frontend
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Bundle Cloudflare Worker
        run: |
          npx esbuild cloudflare/_worker.ts \
            --bundle \
            --platform=neutral \
            --target=es2022 \
            --format=esm \
            --outfile=dist/public/_worker.js \
            --conditions=workerd,worker,browser \
            --main-fields=browser,module,main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/public --project-name=vibe-house --commit-dirty=true

      - name: Smoke-test live custom domain
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/smoke-sfvibehouse.mjs --commit "${{ github.sha }}"; then
              exit 0
            fi
            echo "Live deployment not ready (attempt $attempt/6); retrying in 10 seconds"
            sleep 10
          done
          exit 1
